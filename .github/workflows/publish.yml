name: Publish

# Push a tag that matches packages/c-style/package.json, e.g. v6.5.1-cs.1.
# npm only accepts staged publishes from tokens: this uploads the build, then a
# maintainer approves it (with 2FA) at npmjs.com or with `npm stage approve`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MyProject
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --filter c-style...
      - name: Check the tag matches the package version
        run: test "v$(node -p "require('../packages/c-style/package.json').version")" = "${GITHUB_REF_NAME}"
      - run: pnpm --filter c-style test
      # pnpm builds the tarball (it applies publishConfig and the dist build); npm stages it.
      - run: pnpm --filter c-style pack --pack-destination "$RUNNER_TEMP/pack"
      # A prerelease-style version needs an explicit tag, or npm refuses it.
      - run: npm stage publish "$RUNNER_TEMP"/pack/c-style-*.tgz --tag latest --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
